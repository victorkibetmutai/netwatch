<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor - NetWatch</title>
    <link rel="stylesheet" href="/css/style.css">
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="/" aria-label="Return to NetWatch dashboard">
        <span class="brand-mark">NW</span>
        <span>NetWatch</span>
      </a>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="Toggle light or dark theme">Theme</button>
    </header>

    <main class="container detail-container">
      <a class="back-link" href="/">← Back to dashboard</a>
      <div id="detail-error" class="alert hidden" role="alert"></div>

      <section class="detail-header">
        <div>
          <p class="eyebrow">Monitor detail</p>
          <h1 id="detail-name">Loading...</h1>
          <div class="detail-meta">
            <span id="detail-status" class="status-label"></span>
            <span id="detail-type" class="type-badge"></span>
            <span id="detail-target" class="detail-target"></span>
          </div>
        </div>
        <div class="detail-actions">
          <label for="range-select">Time range</label>
          <select id="range-select">
            <option value="1h">1 hour</option>
            <option value="24h" selected>24 hours</option>
            <option value="7d">7 days</option>
            <option value="30d">30 days</option>
          </select>
          <button id="detail-check" class="button primary" type="button">Check now</button>
        </div>
      </section>

      <section id="detail-stats" class="summary-grid detail-summary" aria-label="Monitor statistics"></section>

      <section class="chart-card">
        <h2>Latency</h2>
        <div class="chart-wrap">
          <canvas id="latency-chart" aria-label="Latency line chart"></canvas>
        </div>
      </section>

      <section class="table-section">
        <h2>Recent checks</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Time</th><th>Status</th><th>Latency</th><th>Status code</th><th>Error</th></tr>
            </thead>
            <tbody id="checks-table"></tbody>
          </table>
        </div>
      </section>

      <section class="table-section">
        <h2>Incident history</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Started</th><th>Ended</th><th>Duration</th><th>Reason</th></tr>
            </thead>
            <tbody id="incidents-table"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/vendor/chart.umd.js"></script>
    <script src="/vendor/chartjs-adapter-date-fns/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script type="module" src="/js/theme.js"></script>
    <script type="module" src="/js/monitor.js"></script>
  </body>
</html>
