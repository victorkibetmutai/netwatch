services:
  netwatch:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_PATH: /app/data/netwatch.db
      CHECK_RETENTION_DAYS: 30
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your shell or .env file}
    volumes:
      - netwatch-data:/app/data
    restart: unless-stopped

volumes:
  netwatch-data:
